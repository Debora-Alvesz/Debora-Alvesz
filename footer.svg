<svg width="100%" height="110" viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE7F3">
        <animate attributeName="stop-color" values="#FCE7F3;#F9A8D4;#FCE7F3" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FFF7FB">
        <animate attributeName="stop-color" values="#FFF7FB;#FCE7F3;#FFF7FB" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FCE7F3">
        <animate attributeName="stop-color" values="#FCE7F3;#F9A8D4;#FCE7F3" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="footerBlur">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="900" height="110" rx="18" fill="url(#footerPink)"/>

  <g filter="url(#footerBlur)" opacity="0.65">
    <ellipse cx="-20" cy="0" rx="170" ry="55" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="920" cy="0" rx="170" ry="55" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g filter="url(#footerBlur)" opacity="0.55">
    <ellipse cx="120" cy="110" rx="190" ry="60" fill="#F9A8D4"/>
    <ellipse cx="780" cy="110" rx="190" ry="60" fill="#F9A8D4"/>
  </g>

  <text x="210" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DB6B9A">✦
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="690" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DB6B9A">✦
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="53" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#9D174D" text-anchor="middle" letter-spacing="1.5">
    Obrigada por visitar meu perfil 🌸
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
  </text>
</svg>
