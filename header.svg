<svg width="100%" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pinkBackground" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7FB">
        <animate attributeName="stop-color" values="#FFF7FB;#FCE7F3;#FFF7FB" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FCE7F3">
        <animate attributeName="stop-color" values="#FCE7F3;#F9A8D4;#FCE7F3" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFF0F7">
        <animate attributeName="stop-color" values="#FFF0F7;#FCE7F3;#FFF0F7" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="cloudBlur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="230" rx="18" fill="url(#pinkBackground)"/>

  <!-- Nuvens -->
  <g filter="url(#cloudBlur)" opacity="0.7">
    <ellipse cx="-30" cy="10" rx="210" ry="75" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.65;0.85;0.65" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="110" cy="25" rx="150" ry="55" fill="#F9A8D4">
      <animate attributeName="opacity" values="0.45;0.7;0.45" dur="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g filter="url(#cloudBlur)" opacity="0.65">
    <ellipse cx="930" cy="5" rx="220" ry="75" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.6;0.85;0.6" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="790" cy="25" rx="160" ry="60" fill="#F9A8D4">
      <animate attributeName="opacity" values="0.45;0.7;0.45" dur="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g filter="url(#cloudBlur)" opacity="0.7">
    <ellipse cx="-30" cy="235" rx="220" ry="75" fill="#F9A8D4">
      <animate attributeName="opacity" values="0.5;0.75;0.5" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="130" cy="225" rx="150" ry="55" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g filter="url(#cloudBlur)" opacity="0.65">
    <ellipse cx="930" cy="235" rx="220" ry="75" fill="#F9A8D4">
      <animate attributeName="opacity" values="0.5;0.75;0.5" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="760" cy="225" rx="160" ry="55" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.55;0.85;0.55" dur="9s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g filter="url(#cloudBlur)" opacity="0.3">
    <ellipse cx="210" cy="95" rx="130" ry="45" fill="#FFFFFF">
      <animateTransform attributeName="transform" type="translate" values="0,0;18,0;0,0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g filter="url(#cloudBlur)" opacity="0.3">
    <ellipse cx="700" cy="110" rx="140" ry="45" fill="#FFFFFF">
      <animateTransform attributeName="transform" type="translate" values="0,0;-20,0;0,0" dur="13s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Brilhos -->
  <circle cx="95" cy="75" r="2" fill="#DB6B9A">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="150" r="1.5" fill="#DB6B9A">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="70" r="2" fill="#DB6B9A">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="165" r="1.5" fill="#DB6B9A">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="45" r="1.5" fill="#BE185D">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <text x="120" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DB6B9A">✦
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="780" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#DB6B9A">✦
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Nome -->
  <text x="450" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="#9D174D" text-anchor="middle" filter="url(#softGlow)">
    Débora Alves
    <animate attributeName="opacity" values="1;0.92;1" dur="5s" repeatCount="indefinite"/>
  </text>

  <line x1="300" y1="125" x2="600" y2="125" stroke="#F472B6" stroke-width="1" opacity="0.55">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
  </line>

  <text x="450" y="153" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#9D174D" text-anchor="middle" letter-spacing="3">
    BACK-END DEVELOPER · JAVA &amp; SPRING BOOT
  </text>

  <text x="450" y="180" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#DB6B9A" text-anchor="middle" letter-spacing="1.5" opacity="0.85">
    construindo sistemas com propósito e cuidado 🌸
  </text>
</svg>
